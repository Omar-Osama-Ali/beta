<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MYRIAM &amp; AHMED</title>

    <!-- SEO / social preview.
         NOTE: crawlers do not run JavaScript, so if you change the names, update them here too.
         For og:image, replace the relative path with the full URL of your published site,
         e.g. https://your-site.com/assets/images/og-image.jpg -->
    <meta name="description" content="You are warmly invited to celebrate the wedding of MYRIAM &amp; AHMED at Saladin Citadel — قلعة صلاح الدين.">
    <meta name="theme-color" content="#fbf9f5">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MYRIAM &amp; AHMED">
    <meta property="og:description" content="You are warmly invited to celebrate the wedding of MYRIAM &amp; AHMED at Saladin Citadel — قلعة صلاح الدين.">
    <meta property="og:image" content="assets/images/og-image.jpg">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ar_EG">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MYRIAM &amp; AHMED">
    <meta name="twitter:description" content="You are warmly invited to celebrate the wedding of MYRIAM &amp; AHMED.">
    <meta name="twitter:image" content="assets/images/og-image.jpg">

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Lets the CSS enable scroll-reveal styles only when JavaScript is running -->
    <script>document.documentElement.classList.add("js");</script>
</head>
<body>

    <noscript>
        <p class="noscript">Please enable JavaScript to open the invitation. · يرجى تفعيل جافاسكريبت لفتح الدعوة.</p>
    </noscript>

    <!-- Music. The source is set from WEDDING_MUSIC in js/main.js when the invitation is opened. -->
    <audio id="weddingAudio" loop preload="none"></audio>

    <!-- Fixed controls -->
    <button type="button" class="control lang-switch" id="langSwitch">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
        <span id="langSwitchLabel">AR</span>
    </button>

    <button type="button" class="control music-toggle" id="musicToggle" aria-pressed="false">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <svg class="icon icon-muted" aria-hidden="true"><use href="#i-music-off"/></svg>
    </button>

    <main class="page">

        <!-- ============ INTRO: ENVELOPE ============ -->
        <section class="intro" id="intro">
            <button type="button" class="envelope-button" id="envelopeButton" data-i18n-aria="openAria">
                <span class="envelope">
                    <span class="envelope-pocket"></span>
                    <span class="envelope-flap"></span>
                    <span class="envelope-monogram" data-bind="monogram" aria-hidden="true"></span>
                    <span class="wax-seal" aria-hidden="true"><svg class="icon"><use href="#i-heart"/></svg></span>
                </span>
                <span class="envelope-hint">
                    <span data-i18n="openHint"></span>
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
                </span>
            </button>
        </section>

        <!-- ============ INVITATION (revealed after the envelope opens) ============ -->
        <div class="content" id="content" hidden>

            <article class="invitation reveal" id="home-section" tabindex="-1">
                <div class="frame">
                    <p class="tag" data-i18n="invitedTag"></p>

                    <p class="basmala" lang="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>

                    <div id="verseBlock">
                        <p class="verse-ar" lang="ar">"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ"</p>
                        <p class="verse-en" data-i18n="verseEn"></p>
                        <p class="verse-ref" data-i18n="verseRef"></p>
                    </div>

                    <div class="divider" aria-hidden="true"><svg class="icon"><use href="#i-star"/></svg></div>

                    <h1 class="names" id="coupleNames">
                        <span class="name" data-bind="bride"></span>
                        <span class="amp" data-bind="amp"></span>
                        <span class="name" data-bind="groom"></span>
                    </h1>

                    <p class="invite-line" data-i18n="inviteLine"></p>

                    <div class="date-badge" id="dateBadge">
                        <span class="item">
                            <svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>
                            <span data-bind="dateLong"></span>
                        </span>
                        <span class="sep" id="dateBadgeSep" aria-hidden="true">|</span>
                        <span class="item" id="dateBadgeTime">
                            <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
                            <span data-bind="timeShort"></span>
                        </span>
                    </div>

                    <div class="countdown-wrap" id="countdownWrap">
                        <div class="countdown" id="countdown" role="timer" data-i18n-aria="countdownAria">
                            <div class="cd-box"><span class="cd-num" data-countdown="days">00</span><span class="cd-lbl" data-i18n="cdDays"></span></div>
                            <div class="cd-box"><span class="cd-num" data-countdown="hours">00</span><span class="cd-lbl" data-i18n="cdHours"></span></div>
                            <div class="cd-box"><span class="cd-num" data-countdown="minutes">00</span><span class="cd-lbl" data-i18n="cdMinutes"></span></div>
                            <div class="cd-box"><span class="cd-num" data-countdown="seconds">00</span><span class="cd-lbl" data-i18n="cdSeconds"></span></div>
                        </div>
                        <p class="cd-finished" id="countdownFinished" data-i18n="cdFinished" hidden></p>
                    </div>

                    <div class="divider" aria-hidden="true"><svg class="icon"><use href="#i-crown"/></svg></div>
                </div>
            </article>

            <!-- Navigation: bottom bar on phones, floating pill on larger screens -->
            <nav class="nav" id="nav" data-i18n-aria="navAria">
                <a href="#home-section"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="navHome"></span></a>
                <a href="#story-section"><svg class="icon" aria-hidden="true"><use href="#i-heart-line"/></svg><span data-i18n="navStory"></span></a>
                <a href="#date-section"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="navDate"></span></a>
                <a href="#venue-section"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="navVenue"></span></a>
                <a href="#rsvp-section" id="navRsvp"><svg class="icon" aria-hidden="true"><use href="#i-envelope"/></svg><span data-i18n="navRsvp"></span></a>
            </nav>

            <div class="details">

                <!-- Story -->
                <section class="panel reveal" id="story-section" aria-labelledby="storyTitle">
                    <h2 class="panel-title" id="storyTitle" data-i18n="storyTitle"></h2>
                    <div class="story-photos">
                        <figure class="photo">
                            <div class="photo-inner">
                                <svg class="icon photo-placeholder" aria-hidden="true"><use href="#i-heart-line"/></svg>
                                <img data-photo="brideChildhood" data-alt="photoBride" alt="" width="240" height="320" loading="lazy" decoding="async">
                            </div>
                        </figure>
                        <figure class="photo is-main">
                            <div class="photo-inner">
                                <svg class="icon photo-placeholder" aria-hidden="true"><use href="#i-heart-line"/></svg>
                                <img data-photo="couple" data-alt="photoCouple" alt="" width="240" height="320" loading="lazy" decoding="async">
                            </div>
                        </figure>
                        <figure class="photo">
                            <div class="photo-inner">
                                <svg class="icon photo-placeholder" aria-hidden="true"><use href="#i-heart-line"/></svg>
                                <img data-photo="groomChildhood" data-alt="photoGroom" alt="" width="240" height="320" loading="lazy" decoding="async">
                            </div>
                        </figure>
                    </div>
                    <p class="caption" data-i18n="storyCaption"></p>
                </section>

                <!-- Date / calendar (generated from the wedding date in js/main.js) -->
                <section class="panel reveal" id="date-section" aria-labelledby="dateTitle">
                    <h2 class="panel-title" id="dateTitle" data-i18n="dateTitle"></h2>
                    <div class="calendar" id="calendar" role="group">
                        <p class="cal-month" id="calMonth"></p>
                        <div class="cal-grid" id="calendarGrid"></div>
                    </div>
                    <p class="date-note" id="dateNote">
                        <svg class="icon" aria-hidden="true"><use id="dateNoteIcon" href="#i-calendar"/></svg>
                        <span data-bind="dateNote"></span>
                    </p>
                </section>

                <!-- Venue -->
                <section class="panel reveal" id="venue-section" aria-labelledby="venueTitle">
                    <h2 class="panel-title" id="venueTitle" data-i18n="venueTitle"></h2>
                    <svg class="icon venue-icon" aria-hidden="true"><use href="#i-landmark"/></svg>
                    <p class="venue-name" data-bind="venuePrimary"></p>
                    <p class="venue-name-alt" data-bind="venueSecondary"></p>
                    <p class="venue-city" data-bind="venueCity"></p>
                    <a class="btn-outline" id="mapLink" href="#" target="_blank" rel="noopener noreferrer">
                        <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>
                        <span data-i18n="mapsButton"></span>
                    </a>
                </section>
            </div>

            <!-- RSVP (removed automatically if neither a form endpoint nor a WhatsApp number is configured) -->
            <section class="rsvp reveal" id="rsvp-section" aria-labelledby="rsvpTitle">
                <h2 class="rsvp-title" id="rsvpTitle" data-i18n="rsvpTitle"></h2>
                <p class="rsvp-text" data-i18n="rsvpText"></p>
                <button type="button" class="btn-gold" id="rsvpOpen">
                    <span data-i18n="rsvpButton"></span>
                    <svg class="icon" aria-hidden="true"><use href="#i-envelope"/></svg>
                </button>
            </section>

            <footer class="site-footer">
                <p data-i18n="footerLove"></p>
                <p class="footer-names"><span data-bind="bride"></span> <span data-bind="amp"></span> <span data-bind="groom"></span></p>
            </footer>
        </div>
    </main>

    <!-- RSVP modal -->
    <div class="modal" id="rsvpModal" role="dialog" aria-modal="true" aria-labelledby="rsvpModalTitle" hidden>
        <div class="modal-box" id="rsvpModalBox" tabindex="-1">
            <button type="button" class="modal-close" id="rsvpClose" data-i18n-aria="closeAria">
                <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
            <h2 class="panel-title" id="rsvpModalTitle" data-i18n="rsvpModalTitle"></h2>
            <form id="rsvpForm" novalidate>
                <div class="field">
                    <label for="guestName" data-i18n="rsvpName"></label>
                    <input type="text" id="guestName" name="name" required autocomplete="name" data-i18n-placeholder="rsvpNamePh">
                </div>
                <div class="field">
                    <label for="guestCompanions" data-i18n="rsvpCompanions"></label>
                    <input type="number" id="guestCompanions" name="companions" min="0" max="8" value="0" inputmode="numeric" required>
                </div>
                <div class="field">
                    <label for="guestNote" data-i18n="rsvpNote"></label>
                    <textarea id="guestNote" name="note" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-gold btn-block" id="rsvpSubmit" data-i18n="rsvpSubmit"></button>
                <p class="form-msg is-success" id="rsvpSuccess" role="status" data-i18n="rsvpSuccess" hidden></p>
                <p class="form-msg is-error" id="rsvpError" role="alert" data-i18n="rsvpError" hidden></p>
            </form>
        </div>
    </div>

    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.2C6 17.2 2.5 13.8 2.5 9.6 2.5 6.7 4.7 4.5 7.5 4.5c1.9 0 3.5 1 4.5 2.6 1-1.6 2.6-2.6 4.5-2.6 2.8 0 5 2.2 5 5.1 0 4.2-3.5 7.6-9.5 11.6z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-heart-line" viewBox="0 0 24 24"><path d="M12 20.5C6.3 16.8 3 13.6 3 9.7 3 7.1 5 5 7.6 5c1.7 0 3.2.9 4.4 2.4C13.200 5.900 14.700 5 16.400 5 19 5 21 7.100 21 9.700c0 3.900-3.300 7.100-9 10.800z"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.500 2.500L12 21l-2.500-6.500L3 12l6.500-2.500z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3.500 18h17M4 18L3 7l5 4 4-6 4 6 5-4-1 11"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.500"/><path d="M2.500 12h19M12 2.500c2.600 2.800 3.900 6 3.900 9.500s-1.300 6.700-3.900 9.500c-2.600-2.800-3.900-6-3.900-9.500S9.400 5.300 12 2.500z"/></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5.500 9.500V20h13V9.500"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15.500" rx="2"/><path d="M3.500 10h17M8 3v4M16 3v4"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.100 7-11.200a7 7 0 0 0-14 0C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.800" r="2.500"/></symbol>
        <symbol id="i-envelope" viewBox="0 0 24 24"><rect x="3" y="5.500" width="18" height="13" rx="2"/><path d="M3.500 7.500L12 13l8.500-5.500"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
        <symbol id="i-landmark" viewBox="0 0 24 24"><path d="M3 21h18M5.500 21V10.500M10 21V10.500M14 21V10.500M18.500 21V10.500M2.500 10l9.500-6.500L21.500 10z"/></symbol>
        <symbol id="i-music-off" viewBox="0 0 24 24"><path d="M9 18V5.500l11-2V16"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/><path d="M3 3l18 18"/></symbol>
    </svg>

    <script src="js/main.js"></script>
</body>
</html>
