<!-- نموذج تأكيد الحضور (RSVP) ربط Formspree -->
<form action="https://formspree.io/f/mrpezdee" method="POST" class="rsvp-form">

  <!-- السطر الأول: الاسم بالكامل وموقف الحضور -->
  <div class="form-row">
    <div class="form-group">
      <label for="name">الاسم بالكامل</label>
      <input type="text" id="name" name="name" required placeholder="اكتب اسمك">
    </div>

    <div class="form-group">
      <label for="attendance">موقف الحضور</label>
      <select id="attendance" name="attendance" required>
        <option value="" disabled selected>اختر</option>
        <option value="يسعدني الحضور">يسعدني الحضور</option>
        <option value="أعتذر عن الحضور">أعتذر عن الحضور</option>
      </select>
    </div>
  </div>

  <!-- السطر الثاني: البريد الإلكتروني وعدد المرافقين -->
  <div class="form-row">
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" required placeholder="example@domain.com">
    </div>

    <div class="form-group">
      <label for="guests">عدد المرافقين</label>
      <select id="guests" name="guests" required>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
  </div>

  <!-- السطر الثالث: كلمة للعروسين -->
  <div class="form-group full-width">
    <label for="message">كلمة للعروسين</label>
    <textarea id="message" name="message" rows="4" placeholder="اكتب تهنئتك لـ Myriam & Ahmed"></textarea>
  </div>

  <!-- زر الإرسال -->
  <button type="submit" class="submit-btn">إرسال تأكيد الحضور</button>

</form>
